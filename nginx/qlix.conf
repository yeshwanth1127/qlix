# Qlix — HTTPS reverse proxy
#
# Replace qlix.exora.solutions with your actual subdomain (e.g. qlix.example.com) in every
# occurrence below before running deploy.sh.
#
# After updating:
#   sudo cp /var/www/qlix/nginx/qlix.conf /etc/nginx/sites-available/qlix
#   sudo ln -sf /etc/nginx/sites-available/qlix /etc/nginx/sites-enabled/qlix
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL certs are issued by deploy.sh via certbot. Do NOT manually replace the
# ssl_certificate lines — certbot manages them.

# Rate-limit zones (shared across workers). `auth` is tight for credential endpoints; `api` is a
# broader ceiling for the rest of the API. Bursts absorb legitimate spikes; excess is delayed/denied.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name qlix.exora.solutions;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qlix.exora.solutions;

    ssl_certificate     /etc/letsencrypt/live/qlix.exora.solutions/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qlix.exora.solutions/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Don't advertise nginx version in responses / error pages.
    server_tokens off;

    # ── Security headers (apply to every response, incl. proxied ones) ────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    client_max_body_size 50M;
    limit_conn conn_limit 50;

    # ── Backend: API routes ──────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── Backend: auth endpoints (tighter limit against brute force) ───────────
    location ~ ^/api/v1/auth/(login|signup|guest|super-admin) {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Backend: SSE streaming (agent runs, team runs) ───────────────────────
    # Matches /api/v1/agents/*/runs/*/stream and /api/v1/teams/*/runs/*/stream
    location ~ ^/api/v1/(agents|teams)/[^/]+/runs/[^/]+/stream$ {
        proxy_pass             http://127.0.0.1:4000;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       Connection        '';
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     600s;
        chunked_transfer_encoding on;
        add_header             X-Accel-Buffering no;
    }

    # ── Backend: .well-known (DID doc, OAuth meta) ───────────────────────────
    location /.well-known/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Frontend: Next.js (all other traffic) ───────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
