# Qlix origin for Cloudflare Tunnel (HTTP only — TLS terminates at Cloudflare).
# Mirrors nginx/qlix.conf routing, bound to 127.0.0.1 via docker-compose.tunnel.yml.
# Upstream: Next.js on host :3000, Express API on host :4000.

limit_req_zone $binary_remote_addr zone=qlix_auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=qlix_api_limit:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=qlix_conn_limit:10m;

# Docker Desktop advertises both IPv4 and IPv6 host-gateway addresses, but its
# bridge currently has no route to the IPv6 address. Resolve upstreams at
# request time with IPv6 disabled so nginx never selects the unreachable path.
resolver 127.0.0.11 ipv6=off valid=30s;

upstream qlix_frontend {
    zone qlix_frontend 64k;
    server host.docker.internal:3000 resolve;
}

upstream qlix_backend {
    zone qlix_backend 64k;
    server host.docker.internal:4000 resolve;
}

server {
    listen 80;
    server_name qlixdev.exora.solutions;

    server_tokens off;
    client_max_body_size 50M;
    limit_conn qlix_conn_limit 50;

    location ~ ^/api/v1/(agents/[^/]+/(ping|runs/poll|runs/[^/]+/(event|injections|complete)|runner/|jit/|inference/|local-environment)|actions/(start|complete)|jit/) {
        proxy_pass         http://qlix_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location ~ ^/api/v1/auth/(login|signup|guest|super-admin) {
        limit_req zone=qlix_auth_limit burst=10 nodelay;
        proxy_pass         http://qlix_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location ~ ^/api/v1/(agents|teams)/[^/]+/(runner/)?runs/[^/]+/stream$ {
        proxy_pass             http://qlix_backend;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_set_header       Connection        '';
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     600s;
        proxy_send_timeout     600s;
        chunked_transfer_encoding on;
        add_header             X-Accel-Buffering no;
    }

    location /api/ {
        limit_req zone=qlix_api_limit burst=60 nodelay;
        proxy_pass         http://qlix_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    location /.well-known/ {
        proxy_pass         http://qlix_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location / {
        proxy_pass         http://qlix_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
