[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "qlix"
version = "0.1.0"
description = "Qlix SDK — signed, audited tool execution for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Qlix" }]
keywords = ["agents", "did", "ed25519", "audit", "qlix", "luna"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "cryptography>=42.0",
  # Advertised by Luna's built-in web_search tool (Tavily -> DDGS fallback).
  "tavily-python>=0.7,<1.0",
  "ddgs>=9,<10",
  # IANA time zones for ZoneInfo on Windows (no system tz database).
  "tzdata>=2024.1",
  # Luna runtime is vendored under qlix.luna — not a separate pip dependency.
]

[project.scripts]
qlix = "qlix.daemon_cli:main"

[project.optional-dependencies]
browser = [
  "playwright>=1.40,<2",
]
hybrid = [
  "gui-agents>=0.3.2",
  "pyautogui>=0.9.54",
  "reportlab>=4.0",
  "openpyxl>=3.1",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://qlix.dev"
Repository = "https://github.com/yeshwanth1127/qlix"
Issues = "https://github.com/yeshwanth1127/qlix/issues"

[tool.hatch.build.targets.wheel]
packages = ["qlix"]

[tool.hatch.build.targets.wheel.sources]
"qlix" = "qlix"

[tool.hatch.build]
exclude = [
  "**/__pycache__",
  "**/*.py[cod]",
  "**/node_modules",
  "**/package-lock.json",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "tests/**",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "**/__pycache__",
  "**/*.py[cod]",
  "**/node_modules",
  "**/package-lock.json",
  "**/.pytest_cache",
  "**/.ruff_cache",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
